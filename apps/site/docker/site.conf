map $remote_addr $masked_addr {
  default 0.0.0.0;
  "~^(?<octets>\d+\.\d+\.\d+)\.\d+$" "${octets}.0";
  "~^(?<hextets>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${hextets}::";
}

map $arg_c $install_campaign {
  default direct;
  "~^(?<tag>[A-Za-z0-9_-]{1,32})$" $tag;
}

log_format masked '$masked_addr [$time_local] "$request" $status $body_bytes_sent';

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout masked;

  error_page 404 /404.html;

  location = /install {
    include /etc/nginx/snippets/security-headers.conf;
    return 302 "https://chromewebstore.google.com/detail/gdhpeilfkeeajillmcncaelnppiakjhn?utm_source=landing&utm_medium=web&utm_campaign=$install_campaign";
  }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri.html =404;
  }
}
