map $remote_addr $masked_addr {
  default 0.0.0.0;
  "~^(?<octets>\d+\.\d+\.\d+)\.\d+$" "${octets}.0";
  "~^(?<hextets>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${hextets}::";
}

map $arg_c $install_campaign {
  default direct;
  "~^(?<tag>[A-Za-z0-9_-]{1,32})$" $tag;
}

map $http_user_agent $store_listing {
  default https://chromewebstore.google.com/detail/snug-bookmark-export-impo/gdhpeilfkeeajillmcncaelnppiakjhn;
  "~Edg/" https://microsoftedge.microsoft.com/addons/detail/efknehclgcncocgochoibgiiagklcnho;
}

map $http_user_agent $store_reviews {
  default https://chromewebstore.google.com/detail/snug-bookmark-export-impo/gdhpeilfkeeajillmcncaelnppiakjhn/reviews;
  "~Edg/" https://microsoftedge.microsoft.com/addons/detail/efknehclgcncocgochoibgiiagklcnho;
}

map $uri $not_found_page {
  default /404.html;
  "~^/(?<locale_segment>es|de|fr|it|ja|ko|pt-br|ru|zh-cn)/" /$locale_segment/404/index.html;
}

map $uri $resource_policy {
  default same-origin;
  "~^/og/" cross-origin;
}

log_format masked '$masked_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout masked;

  absolute_redirect off;
  error_page 404 $not_found_page;

  location ~ ^/(?:pt-BR|pt_BR|pt_br)/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 /pt-br/;
  }

  location ~ ^/(?:zh-CN|zh_CN|zh_cn)/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 /zh-cn/;
  }

  location ~ ^/install/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 302 "$store_listing?utm_source=landing&utm_medium=web&utm_campaign=$install_campaign";
  }

  location ~ ^/reviews/?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 302 "$store_reviews?utm_source=landing&utm_medium=web&utm_campaign=$install_campaign";
  }

  location ~ ^(?<index_dir>/(?:(?:es|de|fr|it|ja|ko|pt-br|ru|zh-cn)/)?)index\.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 $index_dir$is_args$args;
  }

  location ~ ^/(?:es|de|fr|it|ja|ko|pt-br|ru|zh-cn)/404(?:/|/index\.html)?$ {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location ~ ^(?<slash_path>/[A-Za-z0-9_/-]*[A-Za-z0-9_-])$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 $slash_path/$is_args$args;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location ~ ^/(?:og/[^/]+\.png|favicon\.ico|favicon\.svg|apple-touch-icon\.png)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /speculation-rules.json {
    include /etc/nginx/snippets/security-headers.conf;
    types { application/speculationrules+json json; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Speculation-Rules '"/speculation-rules.json"' always;
    try_files $uri $uri/index.html $uri.html =404;
  }
}
