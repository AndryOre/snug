name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 4200))
          while true; do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI passed")] | sort_by(.id) | last // empty')
            status=$(jq -r '.status // empty' <<< "${run_json}")
            conclusion=$(jq -r '.conclusion // empty' <<< "${run_json}")
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "CI passed concluded success for ${GITHUB_SHA}"
                exit 0
              fi
              echo "CI passed concluded ${conclusion} for ${GITHUB_SHA}. Re-run the failed CI job on main, then re-run this workflow."
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              if [[ -z "${status}" ]]; then
                echo "No CI passed check run found for ${GITHUB_SHA} after 70 minutes"
              else
                echo "CI passed is still ${status} for ${GITHUB_SHA} after 70 minutes"
              fi
              exit 1
            fi
            echo "CI passed is ${status:-missing}, checking again in 30s"
            sleep 30
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  release:
    name: Build and publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      already-released: ${{ steps.github-release.outputs.already-released }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches extension package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./apps/extension/package.json').version")
          if [[ "${tag_version}" != "${pkg_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/extension/package.json version ${pkg_version}"
            exit 1
          fi

      - name: Build extension zip
        run: bun run zip

      - name: Extract changelog section
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="${tag_version}" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md section found for version ${tag_version}"
            exit 1
          fi

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/extension/.output/*-chrome.zip
            apps/extension/.output/*-edge.zip

      - name: Publish GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "::warning::Release ${GITHUB_REF_NAME} already exists, so store publishing is skipped. If a store job failed earlier, use Re-run failed jobs instead of Re-run all jobs."
            echo "already-released=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "already-released=false" >> "${GITHUB_OUTPUT}"
          chrome_zip_path=$(ls apps/extension/.output/*-chrome.zip)
          edge_zip_path=$(ls apps/extension/.output/*-edge.zip)
          gh release create "${GITHUB_REF_NAME}" "${chrome_zip_path}" "${edge_zip_path}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md

      - name: Upload extension zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension-zip
          path: apps/extension/.output/*-chrome.zip
          include-hidden-files: true
          retention-days: 1

      - name: Upload Edge extension zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-extension-zip
          path: apps/extension/.output/*-edge.zip
          include-hidden-files: true
          retention-days: 1

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    needs: [verify, release]
    if: needs.release.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension-zip
          path: apps/extension/.output

      - name: Verify Chrome Web Store secrets are configured
        env:
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          missing=()
          [[ -z "${CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL}" ]] && missing+=("CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL")
          [[ -z "${CHROME_SERVICE_ACCOUNT_PRIVATE_KEY}" ]] && missing+=("CHROME_SERVICE_ACCOUNT_PRIVATE_KEY")
          [[ -z "${CHROME_PUBLISHER_ID}" ]] && missing+=("CHROME_PUBLISHER_ID")
          [[ -z "${CHROME_EXTENSION_ID}" ]] && missing+=("CHROME_EXTENSION_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Chrome Web Store secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Submit to Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY:
            ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        working-directory: apps/extension
        run: |
          zip_path=$(ls .output/*-chrome.zip)
          bunx wxt submit --chrome-zip "${zip_path}"

  publish-edge-add-ons:
    name: Publish to Edge Add-ons
    needs: [verify, release]
    if: needs.release.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: edge-add-ons
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-extension-zip
          path: apps/extension/.output

      - name: Verify Edge Add-ons secrets are configured
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          missing=()
          [[ -z "${EDGE_PRODUCT_ID}" ]] && missing+=("EDGE_PRODUCT_ID")
          [[ -z "${EDGE_CLIENT_ID}" ]] && missing+=("EDGE_CLIENT_ID")
          [[ -z "${EDGE_API_KEY}" ]] && missing+=("EDGE_API_KEY")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Edge Add-ons secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Submit to Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        working-directory: apps/extension
        run: |
          zip_path=$(ls .output/*-edge.zip)
          bunx wxt submit --edge-zip "${zip_path}"
