name: CI

on:
  pull_request:
  push:
    branches: [main] # only permanent branches — avoids duplicate runs when a feature branch has an open PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (format · lint · typecheck · knip · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key:
            ${{ runner.os }}-eslintcache-${{ hashFiles('bun.lock',
            'eslint.config.mjs', 'eslint-rules/**') }}
          restore-keys: ${{ runner.os }}-eslintcache-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-quality-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-quality-

      # apps/site is picked up automatically: turbo runs its check script and
      # --affected scopes pull requests to it and packages/ui
      - name: Check and test workspaces (typecheck, unit tests)
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          AFFECTED:
            ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        run: |
          read -r -a affected_flags <<< "$AFFECTED"
          bunx turbo run check test:coverage "${affected_flags[@]}"

      - name: Check and test repo-wide (format, lint, knip, script tests)
        run: bunx turbo run check:root test:root

  build:
    name: Build (extension zip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-build-

      - name: Build extension zip
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          AFFECTED:
            ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        run: |
          read -r -a affected_flags <<< "$AFFECTED"
          bunx turbo run zip "${affected_flags[@]}"

      - name: Enforce zip size budget
        run: bun scripts/check-zip-size.ts apps/extension/.output

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-chrome-zip
          path: apps/extension/.output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/extension
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          AFFECTED:
            ${{ github.event_name == 'pull_request' && '--affected' || '' }}
          AXE_MATRIX:
            ${{ github.event_name == 'pull_request' && 'sampled' || 'full' }}
        run: |
          read -r -a affected_flags <<< "$AFFECTED"
          bunx turbo run test:e2e "${affected_flags[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-report
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  changes:
    name: Detect site changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes under apps/site and packages/ui
        id: filter
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "${zero}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- apps/site packages/ui | grep -q .; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=BrowserStack skipped::No changes under apps/site or packages/ui."
          fi

  # Informational: deliberately absent from `CI passed` needs, so it never
  # blocks a merge. Only PRs run it from here, with the lean tier; the full tier
  # runs from browserstack.yml's own push, schedule and dispatch triggers so its
  # hours-long run never holds this workflow's concurrency group on main.
  browserstack:
    name: BrowserStack (site layout)
    needs: [changes]
    if:
      github.event_name == 'pull_request' && needs.changes.outputs.site ==
      'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/browserstack.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      tier: lean
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose

  # Stable status-check name for branch protection: aggregates quality/build/e2e/commitlint
  # so a single required check covers the whole pipeline regardless of which jobs
  # run for a given trigger (e.g. commitlint is skipped on push).
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [quality, build, e2e, commitlint]
    if: always()
    steps:
      - name: Check job results
        env:
          FAILED:
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result,
            'cancelled') }}
        run: |
          if [[ "${FAILED}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
