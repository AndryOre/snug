name: BrowserStack

on:
  workflow_call:
    inputs:
      tier:
        description:
          lean (layout specs without accessibility) or full (every layout spec)
        type: string
        default: lean
      platform:
        description: all, safari, firefox, edge or pixel
        type: string
        default: all
    secrets:
      BROWSERSTACK_USERNAME:
        required: false
      BROWSERSTACK_ACCESS_KEY:
        required: false
      PERCY_TOKEN:
        required: false
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/ui/**
      - .github/workflows/browserstack.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: lean (204 tests, no accessibility spec) or full (932 tests)
        type: choice
        options: [lean, full]
        default: full
      platform:
        description: Run one platform, or all of them
        type: choice
        options: [all, safari, firefox, edge, pixel]
        default: all

permissions:
  contents: read

# PRs supersede their own earlier lean runs. Full runs are never cancelled and
# queue behind each other, so the plan's 5 parallels are not oversubscribed.
concurrency:
  group:
    browserstack-${{ github.event_name == 'pull_request' && github.ref || 'full'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan BrowserStack matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tier: ${{ steps.plan.outputs.tier }}
      available: ${{ steps.plan.outputs.available }}
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      REQUESTED_TIER: ${{ inputs.tier || 'full' }}
      REQUESTED_PLATFORM: ${{ inputs.platform || 'all' }}
    steps:
      - name: Build the platform matrix
        id: plan
        run: |
          if [[ -z "${BROWSERSTACK_USERNAME}" || -z "${BROWSERSTACK_ACCESS_KEY}" ]]; then
            echo "::notice title=BrowserStack skipped::BrowserStack secrets are unavailable (fork PR or missing secrets); skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

          case "${REQUESTED_TIER}" in lean | full) ;; *) echo "::error::Unknown tier '${REQUESTED_TIER}'"; exit 1 ;; esac
          case "${REQUESTED_PLATFORM}" in all | safari | firefox | edge | pixel) ;; *) echo "::error::Unknown platform '${REQUESTED_PLATFORM}'"; exit 1 ;; esac

          # Measured per test on the sponsored plan: Edge ~3s, Firefox ~4s,
          # Safari ~5s, Pixel 8 ~6s. Full tier is 932 tests per platform: Edge
          # ~47m, Firefox ~62m, Safari ~78m, Pixel ~93m. That makes 4
          # single-platform jobs, under the plan's 5 parallels. The lean tier
          # is 204 tests: 10 to 20 minutes per platform. A real iPhone is not
          # automated (ADR 0025).
          matrix="$(jq -nc --arg tier "${REQUESTED_TIER}" --arg platform "${REQUESTED_PLATFORM}" '
            def entry($id; $label; $field; $value):
              {id: $id, label: $label, field: $field, value: $value,
               timeout: 180, shard: ""};
            [
              entry("safari"; "Safari macOS"; "browserName"; "playwright-webkit"),
              entry("firefox"; "Firefox Windows"; "browserName"; "playwright-firefox"),
              entry("edge"; "Edge Windows"; "browserName"; "edge"),
              entry("pixel"; "Pixel 8"; "deviceName"; "Google Pixel 8")
            ]
            | map(select($platform == "all" or .id == $platform))
            | map(if $tier == "lean" then . + {timeout: 60} else . end)
          ')"

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "tier=${REQUESTED_TIER}" >> "$GITHUB_OUTPUT"
          echo "Tier ${REQUESTED_TIER}, platform ${REQUESTED_PLATFORM}: $(jq -r 'map(.id) | join(", ")' <<< "${matrix}")"

  layout:
    name: ${{ matrix.label }} (${{ needs.plan.outputs.tier }})
    needs: [plan]
    if: needs.plan.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_TIER: ${{ needs.plan.outputs.tier }}
      BROWSERSTACK_PLATFORM_LABEL: ${{ matrix.label }}
      PLATFORM_VALUE: ${{ matrix.value }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restrict browserstack.yml to this platform
        working-directory: apps/site
        run: |
          yq -i '.platforms |= map(select(.browserName == strenv(PLATFORM_VALUE) or .deviceName == strenv(PLATFORM_VALUE)))' browserstack.yml
          test "$(yq '.platforms | length' browserstack.yml)" = "1"
          yq '.platforms' browserstack.yml

      - name: Run layout specs on BrowserStack
        working-directory: apps/site
        env:
          AXE_MATRIX: full
        run: |
          if [[ -n "${SHARD}" ]]; then
            bun run test:e2e:browserstack -- "--shard=${SHARD}"
          else
            bun run test:e2e:browserstack
          fi

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-timings-${{ matrix.id }}
          path: apps/site/test-results/browserstack-timings.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-report-${{ matrix.id }}
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  report-failure:
    name: Report a failed nightly run
    needs: [layout]
    if:
      ${{ github.event_name == 'schedule' && needs.layout.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}
    steps:
      - name: Open or update the failure issue
        run: |
          title="Nightly BrowserStack run failing"
          body="The nightly BrowserStack run failed: ${RUN_URL}"
          number="$(gh issue list --repo "${REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi

  resolve-failure:
    name: Close the failure issue after a passing nightly run
    needs: [layout]
    if:
      ${{ github.event_name == 'schedule' && needs.layout.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}
    steps:
      - name: Close the open failure issue
        run: |
          title="Nightly BrowserStack run failing"
          number="$(gh issue list --repo "${REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${REPOSITORY}" --comment "The nightly BrowserStack run passed again: ${RUN_URL}"
          fi

  percy:
    name: Percy cross-browser snapshots
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
    steps:
      - name: Check for the Percy token
        id: token
        run: |
          if [[ -z "${PERCY_TOKEN}" ]]; then
            echo "::notice title=Percy skipped::PERCY_TOKEN is unavailable (fork PR or missing secret); skipping."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.token.outputs.available == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - if: steps.token.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        if: steps.token.outputs.available == 'true'
        run: bun install --frozen-lockfile

      - name: Install Chromium
        if: steps.token.outputs.available == 'true'
        working-directory: apps/site
        run: bunx playwright install --with-deps chromium

      - name: Upload Percy snapshots
        if: steps.token.outputs.available == 'true'
        working-directory: apps/site
        run: bun run test:percy
